name: Compilar PS2
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Dependencias
        run: apk add build-base git
      - uses: actions/checkout@v4
      - name: Compilar
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: ber_the_house_ps2
          path: ber_the_house.elf
